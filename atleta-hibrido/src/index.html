<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d1e">
<meta name="app-env" content="development">
<meta name="description" content="Plano Desafio Atleta Híbrido: corrida e musculação num só lugar.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atleta Híbrido">
<title>Atleta Híbrido · Meu Plano</title>
<link rel="stylesheet" href="styles/app.css">
</head>
<body>
<header><div class="logo">ATLETA <b>HÍBRIDO</b></div></header>
<main id="main"></main>
<div id="timer" hidden><span id="timer-label" class="grow">Descanso</span><b id="timer-clock">0:00</b>
  <button data-act="timerAdd">+15s</button><button data-act="timerStop" aria-label="Parar cronômetro">✕</button></div>
<nav id="nav">
  <button data-act="tab" data-v="home"><span>🏠</span>Hoje</button>
  <button data-act="tab" data-v="run"><span>🏃</span>Corrida</button>
  <button data-act="tab" data-v="lift"><span>🏋️</span>Treinos</button>
  <button data-act="tab" data-v="tools"><span>🧮</span>Ferramentas</button>
</nav>
<script type="module" src="main.js"></script>
</body>
</html>
